<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Letture contatori</title></head>
<body><main><header><h1>Letture contatori</h1><p>Foto → riconoscimento → verifica → salvataggio</p></header>
<section class="card"><h2>Acquisizione</h2><p class="muted">Puoi scattare una nuova foto oppure scegliere una foto già presente sul telefono.</p><div class="row"><label class="photoBtn">Scatta foto<input id="cameraPhoto" type="file" accept="image/*" capture="environment"></label><label class="photoBtn">Scegli dalla libreria<input id="libraryPhoto" type="file" accept="image/*"></label></div><canvas id="preview"></canvas><button id="analyze" disabled>Analizza immagine</button><div id="progress" class="muted"></div></section>
<section class="card"><h2>Dati riconosciuti</h2><label>Codice contatore<input id="meterCode" autocomplete="off" placeholder="es. QKL13"></label><label>Lettura energia (kWh)<input id="reading" inputmode="decimal" placeholder="es. 690317.8"></label><div id="meterHint" class="muted"></div><label>Note<input id="notes" placeholder="facoltative"></label><div class="row"><button id="save">Conferma e salva</button><button id="clear" class="secondary">Pulisci</button></div><details><summary>Testo OCR completo</summary><pre id="raw"></pre></details></section>
<section class="card"><div class="row spread"><h2>Storico</h2><button id="csv" class="secondary">Esporta CSV</button></div><div class="tableWrap"><table><thead><tr><th>Data</th><th>Codice</th><th>kWh</th><th>Note</th><th></th></tr></thead><tbody id="history"></tbody></table></div></section>
<p class="foot">I dati restano sul dispositivo finché non vengono esportati.</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="app.js"></script></body></html>
